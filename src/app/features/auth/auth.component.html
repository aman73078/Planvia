<div class="">
  <div class="container-sm mt-5" style="min-height: 80vh;">
    <div class="card rounded-5 mt-5 shadow-lg overflow-hidden" style="height: 40rem;">
      <div class="card-body d-flex flex-wrap p-0 auth-container" [class.login-mode]="isLogin"
        [class.register-mode]="!isLogin">
        
        <!-- Left Panel -->
        <div class="auth-left d-flex flex-column justify-content-center align-items-center text-white p-4"
          [ngClass]="{
              'login-border': isLogin,
              'register-border': !isLogin
          }">
          <h2 class="fw-bold mb-3">✨ Welcome to Planvia</h2>
          <p class="text-center mb-3">Manage tasks, collaborate seamlessly, and boost your productivity with Planvia.</p>
          <button type="button" class="btn btn-transparent" (click)="toggleMode()">
            {{ isLogin ? 'Create an Account' : 'Already a Member?' }}
          </button>
        </div>

        <!-- Right Panel -->
        <div class="auth-right p-5 d-flex flex-column justify-content-center">
          <h4 class="mb-4 fw-semibold text-center">
            {{ isLogin ? 'Login to Planvia' : 'Create your Planvia account' }}
          </h4>

          <form (ngSubmit)="submitForm()" #authForm="ngForm">
            <!-- Name field for registration -->
            <div class="mb-3" *ngIf="!isLogin">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" required [(ngModel)]="authData.name" name="name" />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" required [(ngModel)]="authData.email" name="email" />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" required [(ngModel)]="authData.password" name="password" />
            </div>

            <div class="mb-3" *ngIf="!isLogin">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" required [(ngModel)]="authData.confirmPassword"
                name="confirmPassword" />
            </div>

            <button class="btn btn-primary w-100" type="submit">
              {{ isLogin ? 'Login' : 'Sign Up' }}
            </button>
          </form>

          <p class="text-center mt-3">
            {{ isLogin ? "Don't have an account?" : "Already have an account?" }}
            <a href="#" (click)="toggleMode()" class="text-decoration-none fw-bold">
              {{ isLogin ? 'Sign Up' : 'Login' }}
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
