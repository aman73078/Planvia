<div class="contact-wrapper d-flex flex-column flex-lg-row min-vh-100">
  <!-- Left: Contact Form -->
  <div class="col-lg-6 p-5 bg-light d-flex flex-column justify-content-center">
    <h1 class="display-4 fw-bold mb-3">
      Get in Touch with <span class="text-gradient">Planvia</span>
    </h1>
    <p class="lead mb-4">
      Have questions or feedback? We'd love to hear from you—drop us a message and we’ll get back shortly.
    </p>
    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold">Name</label>
        <input type="text" class="form-control rounded-pill" placeholder="Your Name">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control rounded-pill" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Message</label>
        <textarea class="form-control rounded-4" rows="4" placeholder="Your message…"></textarea>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-gradient px-5 py-3 rounded-pill">
          Send Message
        </button>
      </div>
    </form>
  </div>

  <!-- Right: Illustration & Info -->
  <div class="col-lg-6 position-relative overflow-hidden">
    <div class="glass-card h-100 d-flex flex-column align-items-center justify-content-center p-5">
      <img src="images/contact.png" alt="Contact Illustration" class="img-fluid rounded mb-4" />
      <p class="text-muted text-center">Ready to collaborate? Let's make something amazing together 💡</p>
    </div>
  </div>
</div>
